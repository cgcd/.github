<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title">
  <title id="title">Centre gouvernemental de cyberdéfense</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0b2744"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="150" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d7fd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d7fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#095797"/>
      <stop offset="0.6" stop-color="#2eb8ff"/>
      <stop offset="1" stop-color="#7fe3ff"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="130" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2eb8ff"/>
      <stop offset="1" stop-color="#8ae8ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8fc6ff" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask">
      <rect width="1200" height="300" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sweep { transform-origin: 1010px 150px; animation: spin 6s linear infinite; }
      .blip { opacity: 0.15; animation: ping 6s ease-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes ping { 0% { opacity: 1; } 45% { opacity: 0.15; } 100% { opacity: 0.15; } }
      @keyframes blink { 50% { fill-opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .sweep, .blip, .cursor { animation: none; }
        .blip { opacity: 0.8; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotsMask)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- Radar -->
    <g fill="none" stroke="#3b8fd9" stroke-opacity="0.45">
      <circle cx="1010" cy="150" r="112"/>
      <circle cx="1010" cy="150" r="75" stroke-opacity="0.3"/>
      <circle cx="1010" cy="150" r="38" stroke-opacity="0.3"/>
      <path d="M898 150H1122M1010 38V262" stroke-opacity="0.2"/>
    </g>
    <g class="sweep">
      <path d="M1010 150L1122 150A112 112 0 0 0 1089.2 70.8Z" fill="url(#sweep)"/>
      <path d="M1010 150L1122 150" stroke="#7fe3ff" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>
    <g fill="#7fe3ff">
      <circle class="blip" cx="1067.3" cy="190.2" r="4" style="animation-delay:0.58s"/>
      <circle class="blip" cx="941.1" cy="207.9" r="3.5" style="animation-delay:2.33s"/>
      <circle class="blip" cx="977.9" cy="111.7" r="3" style="animation-delay:3.83s"/>
      <circle class="blip" cx="1057.5" cy="67.7" r="4.5" style="animation-delay:5s"/>
    </g>
    <circle cx="1010" cy="150" r="3" fill="#7fe3ff"/>

    <!-- Wordmark -->
    <text x="64" y="76" class="mono" font-size="13" letter-spacing="3" fill="#4fc3ff">CGCD · INGÉNIERIE &amp; DONNÉES</text>
    <text x="62" y="138" class="sans" font-size="50" font-weight="600" fill="#ffffff">Centre gouvernemental</text>
    <text x="62" y="196" class="sans" font-size="50" font-weight="600" fill="#ffffff">de <tspan fill="url(#textAccent)">cyberdéfense</tspan></text>
    <text x="64" y="246" class="mono" font-size="17"><tspan fill="#4fc3ff">~/cgcd</tspan><tspan fill="#c9d8ea"> $ make run </tspan><tspan class="cursor" fill="#c9d8ea">▍</tspan></text>

    <rect y="296" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
